<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán đơn hàng</title>
</head>
<body>
    <h1>THANH TOÁN</h1>

    <table border="1">
        <thead>
            <tr>
                <th>STT</th>
                <th>Sản phẩm</th>
                <th>Đơn giá</th>
                <th>Số lượng</th>
                <th>Thành tiền</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1</td>
                <td>iPhone 16</td>
                <td>25.000.000đ</td>
                <td>1</td>
                <td>25.000.000đ</td>
            </tr>
             <tr>
                <td>2</td>
                <td>Sạc điện thoại</td>
                <td>500.000đ</td>
                <td>1</td>
                <td>500.000đ</td>
            </tr>
             <tr>
                <td>3</td>
                <td>Tai nghe</td>
                <td>300.000đ</td>
                <td>1</td>
                <td>300.000đ</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="4">Tổng cộng</td>
                <td><output>25.800.000đ</output></td>
            </tr>
        </tfoot>
    </table>

    <form>
        <h3>Phương thức thanh toán</h3>
        <input type="radio" id="cod" name="pay" checked> <label for="cod">COD</label>
        <input type="radio" id="bank" name="pay"> <label for="bank">Chuyển khoản</label>

        <h3>Thông tin bổ sung</h3>
        <label for="coupon">Mã giảm giá:</label>
        <input type="text" id="coupon" pattern="SALE[0-9]{4}" placeholder="VD: SALE2026">

        <label for="ship-date">Ngày giao hàng mong muốn:</label>
        <input type="date" id="ship-date" min="2026-05-01">

        <label for="speed">Thời gian giao hàng (ngày):</label>
        <input type="range" id="speed" min="1" max="7" step="1">

        <p>Điểm tích lũy hiện tại: <meter value="70" min="0" max="100">70%</meter></p>

        <button type="submit" aria-label="Xác nhận đặt hàng">Xác nhận thanh toán</button>
    </form>
</body>
</html>
