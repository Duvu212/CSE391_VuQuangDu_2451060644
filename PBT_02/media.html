<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm Multimedia</title>
</head>
<body>
    <h1>Sản phẩm nổi bật</h1>

    <figure>
        <img src="https://via.placeholder.com/400x250" alt="iPhone 16 Pro Max Titan" loading="lazy" style="max-width: 100%; height: auto;">
        <figcaption>Hình 1: iPhone 16 Pro Max phiên bản Titan tự nhiên.</figcaption>
    </figure>

    <h2>Video giới thiệu</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>

    <h2>Review chi tiết (Video Local)</h2>
    <video controls poster="https://via.placeholder.com/800x450" width="600">
        <source src="video.mp4" type="video/mp4">
        <source src="video.webm" type="video/webm">
    </video>

    <h2>Âm nhạc trải nghiệm</h2>
    <audio controls>
        <source src="background-music.mp3" type="audio/mpeg">
    </audio>

    <h2>Logo thương hiệu (SVG)</h2>
    <svg width="100" height="100">
        <rect width="100" height="100" style="fill:blue; stroke:black; stroke-width:5; opacity:0.5" />
        <text x="20" y="60" fill="white">LOGO</text>
    </svg>
</body>
</html>
