<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản - E-Commerce</title>
</head>
<body>
    <form action="#" method="POST">
        <h1>ĐĂNG KÝ HỘI VIÊN</h1>

        <fieldset>
            <legend>Thông tin cá nhân</legend>
            <label for="fullname">Họ tên:</label>
            <input type="text" id="fullname" name="fullname" required minlength="2" maxlength="50" placeholder="Nguyễn Văn A">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="example@gmail.com">

            <label for="tel">Số điện thoại:</label>
            <input type="tel" id="tel" name="tel" pattern="[0-9]{10}" placeholder="09xxxxxxxx">

            <label for="dob">Ngày sinh:</label>
            <input type="date" id="dob" name="dob" max="2026-04-30">
        </fieldset>

        <fieldset>
            <legend>Tài khoản</legend>
            <label for="user">Username:</label>
            <input type="text" id="user" name="user" pattern="[A-Za-z0-9_]{3,20}" placeholder="Chỉ dùng chữ, số, _">

            <label for="pass">Mật khẩu:</label>
            <input type="password" id="pass" name="pass" minlength="8" pattern="^(?=.*[A-Z])(?=.*[0-9]).*$" placeholder="Ít nhất 1 hoa, 1 số">

            <label for="confirm">Xác nhận mật khẩu:</label>
            <input type="password" id="confirm" name="confirm" minlength="8" placeholder="Nhập lại mật khẩu">
        </fieldset>

        <fieldset>
            <legend>Thông tin giao hàng</legend>
            <label for="city">Thành phố:</label>
            <select id="city" name="city">
                <option value="bn">Bắc Ninh</option>
                <option value="hn">Hà Nội</option>
                <option value="hcm">TP. Hồ Chí Minh</option>
                <option value="dn">Đà Nẵng</option>
                <option value="hp">Hải Phòng</option>
            </select>

            <label>Giới tính:</label>
            <input type="radio" id="m" name="gender" value="male"><label for="m">Nam</label>
            <input type="radio" id="f" name="gender" value="female"><label for="f">Nữ</label>

            <label for="addr">Địa chỉ chi tiết:</label>
            <textarea id="addr" name="addr" rows="3" placeholder="Địa chỉ cụ thể..."></textarea>
        </fieldset>

        <p>
            <input type="checkbox" id="agree" required>
            <label for="agree">Tôi đồng ý với điều khoản</label>
        </p>

        <button type="submit">Đăng ký ngay</button>
        <button type="reset">Xóa form</button>
    </form>
</body>
</html>
