<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="specificity.css">
    <title>Thực hành CSS Specificity</title>
</head>
<body>
    <p id="demo" class="text highlight">Hello World</p>

    <div style="margin-top: 50px; padding: 20px; border: 1px dashed #ccc; font-family: sans-serif;">
        <h3>Hướng dẫn kiểm tra độ ưu tiên (Specificity):</h3>
        <p>1. Nhấn <strong>F12</strong> (hoặc Inspect element).</p>
        <p>2. Chọn thẻ <code>&lt;p id="demo"&gt;</code>.</p>
        <p>3. Quan sát bảng <strong>Styles</strong>: Các rule có Specificity thấp hơn sẽ bị gạch ngang, màu của rule cao nhất sẽ được áp dụng.</p>
    </div>
</body>
</html>
