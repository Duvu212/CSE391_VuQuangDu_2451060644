<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="specificity.css">
    <title>Trận chiến Specificity - Đơn hàng Labubu</title>
</head>
<body>
    <div class="order-container">
        <p id="order-status" class="status-text delivery-now highlight">
            Đơn hàng Labubu Fall in Wild đang được giao đến bạn!
        </p>
    </div>

    <div style="margin-top: 50px; padding: 20px; border: 1px dashed #ccc;">
        <h3>Hướng dẫn kiểm tra:</h3>
        <p>1. Mở file này trên trình duyệt.</p>
        <p>2. Nhấn <strong>F12</strong> -> Thẻ <strong>Elements</strong>.</p>
        <p>3. Chọn dòng thẻ <code>&lt;p&gt;</code> phía trên.</p>
        <p>4. Nhìn sang cột <strong>Styles</strong> bên phải để xem các màu bị gạch bỏ và màu nào đang "thắng".</p>
    </div>
</body>
</html>
