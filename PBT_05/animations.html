<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animations</title>
  <link rel="stylesheet" href="animations.css">
</head>
<body>

  <header class="header">
    <h1>CSS Transitions & Animations</h1>
    <p>Hiệu ứng cho sản phẩm công nghệ AI</p>
  </header>

  <section class="loading-section">
    <h2>Loading Spinner</h2>
    <div class="spinner"></div>
  </section>

  <section class="product-list">
    <div class="product-card fade-in">
      <div class="image-wrapper">
        <div class="product-image">AI</div>
      </div>
      <h3>AI Smart Speaker</h3>
      <p>Loa thông minh điều khiển bằng giọng nói.</p>
      <button>Mua ngay</button>
    </div>

    <div class="product-card fade-in">
      <div class="image-wrapper">
        <div class="product-image">VR</div>
      </div>
      <h3>VR Glasses</h3>
      <p>Kính thực tế ảo cho học tập và giải trí.</p>
      <button>Mua ngay</button>
    </div>

    <div class="product-card fade-in">
      <div class="image-wrapper">
        <div class="product-image">BOT</div>
      </div>
      <h3>Study Robot</h3>
      <p>Robot hỗ trợ học lập trình cơ bản.</p>
      <button>Mua ngay</button>
    </div>
  </section>

</body>
</html>
