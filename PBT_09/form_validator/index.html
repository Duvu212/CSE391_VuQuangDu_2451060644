<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Form Validator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>Đăng ký tài khoản</h1>

        <form id="registerForm">
            <div class="form-group">
                <label>Họ tên</label>
                <input id="name" type="text">
                <small id="nameMsg"></small>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input id="email" type="text">
                <small id="emailMsg"></small>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input id="password" type="password">
                <div class="meter">
                    <div id="strengthBar"></div>
                </div>
                <small id="passwordMsg"></small>
            </div>

            <div class="form-group">
                <label>Nhập lại mật khẩu</label>
                <input id="confirmPassword" type="password">
                <small id="confirmMsg"></small>
            </div>

            <div class="form-group">
                <label>Số điện thoại</label>
                <input id="phone" type="text" placeholder="0901-234-567">
                <small id="phoneMsg"></small>
            </div>

            <button id="submitBtn" type="submit" disabled>Đăng ký</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
