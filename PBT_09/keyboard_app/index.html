<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Keyboard App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <h1>Keyboard Gallery</h1>

        <p>
            Phím tắt: ← → đổi ảnh, số 1-9 nhảy ảnh, Space play/pause, Ctrl+K mở command palette.
        </p>

        <div class="gallery">
            <button id="prevBtn" aria-label="Ảnh trước">←</button>
            <img id="mainImage" src="https://placehold.co/600x350?text=Image+1" alt="Gallery image">
            <button id="nextBtn" aria-label="Ảnh tiếp theo">→</button>
        </div>

        <p id="imageInfo">Ảnh 1 / 5</p>

        <button id="openModalBtn" aria-label="Mở ảnh lớn">Mở ảnh lớn</button>
        <button id="commandBtn" aria-label="Mở command palette">Mở Command Palette</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
