<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneaker Store - Flexbox Layout</title>
    <link rel="stylesheet" href="flexbox.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <a href="#">SNEAKER-X</a>
        </div>
        
        <nav class="menu">
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">Products</a></li>
                <li><a href="#">New Arrivals</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>

        <div class="auth-buttons">
            <button class="btn login">Login</button>
            <button class="btn register">Register</button>
        </div>
    </header>

    <main class="container">
        <h1 class="title">Featured Sneakers</h1>
        
        <section class="product-grid">
            <article class="card">
                <img src="https://via.placeholder.com/250x200" alt="Nike Air Max">
                <div class="card-content">
                    <h3>Nike Air Max 270</h3>
                    <p class="price">$150.00</p>
                </div>
                <button class="buy-btn">Buy Now</button>
            </article>

            <article class="card">
                <img src="https://via.placeholder.com/250x200" alt="Adidas Ultraboost">
                <div class="card-content">
                    <h3>Adidas Ultraboost</h3>
                    <p class="price">$180.00</p>
                </div>
                <button class="buy-btn">Buy Now</button>
            </article>

            <article class="card">
                <img src="https://via.placeholder.com/250x200" alt="Sneaker">
                <div class="card-content"><h3>Jordan Retro</h3><p class="price">$200.00</p></div>
                <button class="buy-btn">Buy Now</button>
            </article>
            <article class="card">
                <img src="https://via.placeholder.com/250x200" alt="Sneaker">
                <div class="card-content"><h3>Yeezy Boost</h3><p class="price">$220.00</p></div>
                <button class="buy-btn">Buy Now</button>
            </article>
            <article class="card">
                <img src="https://via.placeholder.com/250x200" alt="Sneaker">
                <div class="card-content"><h3>New Balance 550</h3><p class="price">$110.00</p></div>
                <button class="buy-btn">Buy Now</button>
            </article>
            <article class="card">
                <img src="https://via.placeholder.com/250x200" alt="Sneaker">
                <div class="card-content"><h3>Converse Chuck 70</h3><p class="price">$85.00</p></div>
                <button class="buy-btn">Buy Now</button>
            </article>
            <article class="card">
                <img src="https://via.placeholder.com/250x200" alt="Sneaker">
                <div class="card-content"><h3>Puma RS-X</h3><p class="price">$120.00</p></div>
                <button class="buy-btn">Buy Now</button>
            </article>
            <article class="card">
                <img src="https://via.placeholder.com/250x200" alt="Sneaker">
                <div class="card-content"><h3>Vans Old Skool</h3><p class="price">$65.00</p></div>
                <button class="buy-btn">Buy Now</button>
            </article>
        </section>
    </main>

</body>
</html>
